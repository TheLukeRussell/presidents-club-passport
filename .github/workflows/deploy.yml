# Builds the demo and puts it on GitHub Pages every time main changes.
# If typecheck or the unit tests fail, nothing gets deployed.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push cancels a deploy that hasn't started yet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # Fills in dist/config.js (Supabase and PostHog) from this repository's
      # Actions secrets, so the values never sit in the repo. With none set,
      # it stays blank and the site runs the demo, as it always has. Only
      # public, browser-safe values belong here: the script refuses a
      # service role key or a PostHog personal key, and never prints a value.
      - run: node scripts/write-config.js dist/config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          ONETRUST_ANALYTICS_GROUP: ${{ secrets.ONETRUST_ANALYTICS_GROUP }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
