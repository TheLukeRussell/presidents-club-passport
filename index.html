<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="A clickable demo of the President’s Club Passport 2027: a passport for every rep with a stamp for each training, fair, Hub course and Club Express, plus standings on the five minimums, built on sample data." />
    <title>President’s Club Passport 2027</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The mono for the machine-readable strip. It loads without holding up
         the page, so a network that blocks Google can't stop the app starting. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400&display=swap" />
    </noscript>
  </head>
  <body>
    <noscript>
      <p class="noscript">This passport needs JavaScript to run. Turn it on and reload the page.</p>
    </noscript>
    <div id="root"></div>
    <!-- OneTrust hook. To use OneTrust for the cookie question, paste its
         script here, above config.js:
           <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js" data-domain-script="YOUR-DOMAIN-SCRIPT-ID" charset="UTF-8"></script>
           <script>function OptanonWrapper() {}</script>
         The passport then hides its own banner and starts analytics only
         while OneTrust's analytics group (onetrustAnalyticsGroup in
         config.js, C0002 by default) is allowed. See src/analytics/consent.ts. -->
    <!-- Runtime settings (Supabase, PostHog), filled in by the deploy. A plain
         script, not a module, so it's read before the app starts. Blank, the
         app runs the demo. -->
    <script src="config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
